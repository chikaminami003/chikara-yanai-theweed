<script>
/* =========================================================
   the seed 試作版
   ・本物のサーバーはありません。データはすべて「見本（架空の会社）」です。
   ・あなたが打刻した記録などは、このブラウザの中だけに保存されます。

// ---------- 1. 見本データ ----------
const COMPANY = "株式会社みらい精機（架空）";
const OFFICE = { name: "本社工場", lat: 35.1709, lng: 136.8815, radius: 300 }; // 見本の位置

const ROLES = {

// 見本の売上データを作る（毎回同じ結果になるよう、決まった数列で作っています）
function makeSampleSales() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pairs = [["p1", "c1", 400, 900], ["p2", "c2", 60, 200], ["p3", "c3", 150, 500], ["p4", "c4", 3, 12], ["p5", "c1", 1, 1], ["p1", "c2", 100, 300]];
  const out = [], now = new Date(); now.setHours(12, 0, 0, 0);
  for (let back = 800; back >= 0; back--) {
    const d = new Date(now); d.setDate(d.getDate() - back);
    if (d.getDay() === 0 || d.getDay() === 6) continue; // 土日は休み
    const growth = 1 + (800 - back) / 1600; // 少しずつ伸びている会社という設定
    SALES_REPS.forEach((r, ri) => {
      if (rnd() < 0.45) return;
      const [pid, cid, lo, hi] = pairs[Math.floor(rnd() * pairs.length)];
      const prod = PRODUCTS.find(x => x.id === pid);
      const qty = Math.max(1, Math.round((lo + rnd() * (hi - lo)) * growth * (ri === 1 ? 1.15 : 1)));
      out.push({ id: "s" + out.length, date: ymd(d), rep: r.id, product: pid, customer: cid, qty, price: prod.price, note: "" });
    });
  }
  return out;
}

function distanceM(a, b) { // 2点間の距離（メートル）
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

// ---------- 売上の集計（日・週・月・四半期・年） ----------
const UNITS = { day: "日", week: "週", month: "月", quarter: "四半期", year: "年" };
const BAR_COUNT = { day: 14, week: 12, month: 12, quarter: 8, year: 3 };
// その日が入る期間の、最初の日
function periodStart(d, unit) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  if (unit === "week") x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // 月曜はじまり
  if (unit === "month") x.setDate(1);
  if (unit === "quarter" || unit === "year") {
    const fromStart = (x.getMonth() - (FISCAL_START_MONTH - 1) + 12) % 12; // 年度の何か月目か（0から）
    const back = unit === "quarter" ? fromStart % 3 : fromStart;
    x.setDate(1); x.setMonth(x.getMonth() - back);
  }
  return x;
}
// 期間を n 個ずらす（-1 なら1つ前）
function shiftPeriod(start, unit, n) {
  const x = new Date(start);
  if (unit === "day") x.setDate(x.getDate() + n);
  if (unit === "week") x.setDate(x.getDate() + 7 * n);
  if (unit === "month") x.setMonth(x.getMonth() + n);
  if (unit === "quarter") x.setMonth(x.getMonth() + 3 * n);
  if (unit === "year") x.setFullYear(x.getFullYear() + n);
  return x;
}
function fiscalYear(d) { return d.getMonth() + 1 >= FISCAL_START_MONTH ? d.getFullYear() : d.getFullYear() - 1; }
function periodLabel(start, unit, short) {
  const m = start.getMonth() + 1, w = "日月火水木金土"[start.getDay()];
  if (unit === "day") return short ? `${m}/${start.getDate()}` : `${m}月${start.getDate()}日（${w}）`;
  if (unit === "week") return short ? `${m}/${start.getDate()}〜` : `${m}月${start.getDate()}日の週`;
  if (unit === "month") return short ? `${m}月` : `${start.getFullYear()}年${m}月`;
  const fy = fiscalYear(start);
  if (unit === "quarter") { const q = Math.floor(((m - FISCAL_START_MONTH + 12) % 12) / 3) + 1; return short ? `${String(fy).slice(2)}Q${q}` : `${fy}年度 第${q}四半期`; }
  return `${fy}年度`;
}

function inPeriod(rows, start, unit) {

function monthCalendar(compact) {
  const base = state.calMonth || today().slice(0, 7);
  const [y, m] = base.split("-").map(Number);
  const first = new Date(y, m - 1, 1, 12);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const sel = state.calDay || today();
  let rows = "";
  for (let w = 0; w < 6; w++) {
    let cells = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + w * 7 + i);
      const k = ymd(d);
      const evs = state.events.filter(e => e.day === k);
      const tds = state.todos.filter(t => t.due === k);
      const cls = [d.getMonth() !== m - 1 && "other", k === today() && "today", k === sel && "selected", i === 0 && "sun", i === 6 && "sat"].filter(Boolean).join(" ");
      cells += `<td class="${cls}"><button class="cal-day" data-act="cal-day" data-day="${k}"><span class="cal-num">${d.getDate()}</span>${
        compact ? (evs.length || tds.length ? '<span class="cal-dot"></span>' : "")
        : evs.slice(0, 3).map(e => `<span class="cal-ev ${e.company ? "company" : "private"}">${e.time === "終日" ? "" : e.time.slice(0, 5) + " "}${esc(e.title)}</span>`).join("") + tds.slice(0, 2).map(t => `<span class="cal-todo">☐ ${esc(t.title)}</span>`).join("")
      }</button></td>`;
    }
    rows += `<tr>${cells}</tr>`;
    const nd = new Date(start); nd.setDate(start.getDate() + (w + 1) * 7);
    if (nd.getMonth() !== m - 1 && w >= 3) break;
  }
  return `<div class="cal${compact ? " compact" : ""}">
    <div class="cal-head"><button class="btn secondary small" data-act="cal-month" data-n="-1" aria-label="前の月">‹</button><strong>${y}年${m}月</strong><button class="btn secondary small" data-act="cal-month" data-n="1" aria-label="次の月">›</button><button class="btn-link small" data-act="cal-month" data-n="0">今月</button></div>

}

  "sales-compare"() {
    const unit = state.salesUnit, nowD = new Date();
    const rows = allSales().filter(s => state.salesWho === "all" || s.rep === state.salesWho);
    const cur = periodStart(nowD, unit), prev = shiftPeriod(cur, unit, -1);
    const lastYear = unit === "year" ? null : periodStart(shiftPeriod(cur, "year", -1), unit);
    // 今期は「途中」なので、前期・前年同期も同じ日数までで比べる
    const elapsed = Math.round((parseYmd(ymd(nowD)) - cur) / 86400000) + 1;
    const upTo = (start) => { const end = new Date(start); end.setDate(end.getDate() + elapsed); return rows.filter(s => s.date >= ymd(start) && s.date < ymd(end) && s.date < ymd(shiftPeriod(start, unit, 1))); };
    const vCur = sum(inPeriod(rows, cur, unit)), vPrevSame = sum(upTo(prev)), vPrevAll = sum(inPeriod(rows, prev, unit));
    const vLySame = lastYear ? sum(upTo(lastYear)) : 0;
    const n = BAR_COUNT[unit], bars = [];
    for (let i = n - 1; i >= 0; i--) { const st = shiftPeriod(cur, unit, -i); bars.push({ st, v: sum(inPeriod(rows, st, unit)), now: i === 0 }); }
    const max = Math.max(...bars.map(b => b.v), 1);
    const step = niceStep(max / 3), top = step * Math.ceil(max / step);
    const ticks = [0, 1, 2, 3].map(k => k * step).filter(v => v <= top);
    const group = (key, list) => {
      const ids = [...new Set(rows.map(s => s[key]))];
      const out = ids.map(id => ({ id, name: nameOf(list, id), now: sum(inPeriod(rows.filter(s => s[key] === id), cur, unit)), before: sum(inPeriod(rows.filter(s => s[key] === id), prev, unit)) }))
        .filter(g => g.now || g.before).sort((a, b) => b.now - a.now);
      const m = Math.max(...out.map(g => g.now), 1);
      return table([{ h: key === "rep" ? "担当者" : key === "product" ? "製品" : "売った先" }, { h: "今期（途中）", r: 1 }, { h: "" }, { h: "前期（全体）", r: 1 }],
        out.map(g => [esc(g.name), man(g.now), `<div class="meter" aria-hidden="true"><i style="width:${Math.round(g.now / m * 100)}%"></i></div>`, man(g.before)]));
    };
    const productsAsList = PRODUCTS.map(p => ({ id: p.id, name: `${p.code} ${p.name}` }));
    return head("売上の比較", "営業") +
      `<div class="row" style="justify-content:space-between">
        <div class="tabs" role="tablist" aria-label="比べる期間">${Object.entries(UNITS).map(([u, l]) =>
          `<button class="btn ${u === unit ? "" : "secondary"}" role="tab" aria-selected="${u === unit}" data-act="sales-unit" data-unit="${u}">${l}</button>`).join("")}</div>
        <div class="field" style="grid-auto-flow:column;align-items:center;gap:8px"><label for="sales-who">担当者</label><select id="sales-who">
          <option value="all">全員</option>${SALES_REPS.map(r => `<option value="${r.id}" ${r.id === state.salesWho ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></div>
      </div>
      <div class="tiles">
        <div class="tile"><span class="label">今期：${periodLabel(cur, unit)}（途中）</span><span class="value">${man(vCur)}</span><span class="sub">${elapsed}日目まで</span></div>
        <div class="tile"><span class="label">前期の同じ日数まで</span><span class="value">${man(vPrevSame)}</span><span class="sub">今期は ${deltaText(vCur, vPrevSame)}</span></div>
        ${lastYear ? `<div class="tile"><span class="label">前年の同じ期間（同じ日数まで）</span><span class="value">${man(vLySame)}</span><span class="sub">今期は ${deltaText(vCur, vLySame)}</span></div>` : ""}
        <div class="tile"><span class="label">前期の合計：${periodLabel(prev, unit)}</span><span class="value">${man(vPrevAll)}</span><span class="sub muted">確定した数字</span></div>
      </div>
      <section class="panel">
        <div class="panel-head"><h2>${UNITS[unit]}ごとの売上（直近${n}${{ day: "日", week: "週", month: "か月", quarter: "期", year: "年度" }[unit]}）</h2><span class="spacer"></span><span class="small muted">いちばん右の薄い棒は途中の数字です</span></div>
        <div class="bars" role="img" aria-label="${UNITS[unit]}ごとの売上の棒グラフ">
          <div class="bars-axis">${ticks.map(v => `<span style="bottom:${v / top * 100}%">${man(v).replace("万円", "万")}</span>`).join("")}</div>
          <div class="bars-plot">${ticks.slice(1).map(v => `<div class="bars-grid" style="bottom:${v / top * 100}%"></div>`).join("")}
            ${bars.map(b => `<div class="bar ${b.now ? "now" : ""}" tabindex="0"><i style="height:${b.v / top * 100}%"></i><span class="tip">${periodLabel(b.st, unit)}${b.now ? "（途中）" : ""}：${yen(b.v)}</span></div>`).join("")}</div>
          <div class="bars-x">${bars.map((b, i) => `<span>${unit === "day" || n <= 12 || i % 2 === 0 ? periodLabel(b.st, unit, true) : ""}</span>`).join("")}</div>
        </div>
        <details><summary class="small">表で見る</summary>${table([{ h: "期間" }, { h: "売上", r: 1 }], bars.slice().reverse().map(b => [periodLabel(b.st, unit) + (b.now ? "（途中）" : ""), yen(b.v)]))}</details>
      </section>
      <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">
        ${state.salesWho === "all" ? `<section class="panel"><h2>担当者別</h2>${group("rep", SALES_REPS)}</section>` : ""}
        <section class="panel"><h2>製品別</h2>${group("product", productsAsList)}</section>
        <section class="panel"><h2>売った先別</h2>${group("customer", PARTNERS)}</section>
      </div>`;
  },

// 見本の部品の絵（外部の画像は使えないため、簡単な図で代わりにする）
function niceStep(raw) { // 目盛りをきりのいい数字にする
  const p = 10 ** Math.floor(Math.log10(raw || 1)), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function partSvg(n) {
  const shapes = [
    `<path d="M30 30 H130 V60 H95 V100 H65 V60 H30 Z" /><circle cx="45" cy="45" r="6" class="h"/><circle cx="115" cy="45" r="6" class="h"/><circle cx="80" cy="85" r="5" class="h"/>`,
    `<path d="M40 25 H60 V85 H130 V105 H40 Z" /><circle cx="50" cy="45" r="5" class="h"/><circle cx="110" cy="95" r="5" class="h"/>`,
    `<rect x="25" y="40" width="110" height="45" rx="6"/><circle cx="40" cy="62" r="6" class="h"/><circle cx="120" cy="62" r="6" class="h"/><rect x="65" y="52" width="30" height="20" rx="3" class="h"/>`,
    `<path d="M30 40 L80 25 L130 40 V90 L80 105 L30 90 Z"/><circle cx="80" cy="65" r="10" class="h"/>`,
    `<rect x="30" y="30" width="100" height="70" rx="4" fill="none" stroke-width="3"/><path d="M45 85 L70 55 L90 75 L115 45" fill="none" stroke-width="3"/>`,
  ];
  const tones = ["#8a9aa5", "#a0896b", "#7f9a86", "#9a8fa8", "#8f9f9f"];
  return `<svg viewBox="0 0 160 120" aria-hidden="true"><g fill="${tones[n % tones.length]}" stroke="${tones[n % tones.length]}">${shapes[n % shapes.length]}</g><style>.h{fill:var(--surface-2);stroke:none}</style></svg>`;
}

function statusPillPatent(s) {
  return pill(s, s === "登録" ? "bad" : s === "審査中" ? "warn" : "info");
}

function fmeaNote() {
  return `<div class="note small">S＝影響の重さ、O＝起こりやすさ、D＝見つけにくさ（どれも1〜10）。RPN＝S×O×D。数字が大きいほど先に対策します。</div>`;
}

// ---------- 6. AIの見本出力 ----------
function makeDR(threshold, name) {
  const items = [
    ...DFMEA.map(r => ({ kind: "設計", where: r.item, mode: r.mode, effect: r.effect, rpn: r.s * r.o * r.d, s: r.s, action: r.action })),
    ...PFMEA.map(r => ({ kind: "工程", where: r.proc, mode: r.mode, effect: r.effect, rpn: r.s * r.o * r.d, s: r.s, action: r.action })),
  ].filter(x => x.rpn >= threshold || x.s >= 9).sort((a, b) => b.rpn - a.rpn);
  const max = Math.max(...items.map(i => i.rpn), 1);
  return `<section class="ai-out">
    <span class="ai-tag">the seed が作った下書き</span>
    <h2>${esc(name)} 審議資料</h2>
    <p class="small muted">${today()} 作成 ／ 対象：BR-200 取付ブラケット ／ 基準：RPN ${threshold}以上、または影響の重さ9以上</p>
    <h3>1. 結論（先に読むところ）</h3>
    <p>重点審議は <strong>${items.length}件</strong> です。最も危険度が高いのは「${esc(items[0] ? items[0].where + "の" + items[0].mode : "なし")}」です。
       影響の重さが9以上の項目（強度・脱落に関わるもの）は、RPNが低くても必ず審議します。</p>
    <h3>2. 審議する項目</h3>
    ${table([{ h: "順位", r: 1 }, { h: "区分" }, { h: "場所" }, { h: "故障モード" }, { h: "起きると" }, { h: "RPN" }, { h: "" }, { h: "DRで決めること" }],
      items.map((x, i) => [i + 1, pill(x.kind, "info"), esc(x.where), esc(x.mode), esc(x.effect), rpnPill(x.rpn),
        `<div class="rpn-bar"><span style="width:${Math.round(x.rpn / max * 100)}%;background:${x.rpn >= 150 ? "var(--bad)" : "var(--warn)"}"></span></div>`,
        esc(x.action) + "でよいか。担当と期限を決める。"]))}
    <h3>3. 宿題の書き方</h3>
    <p class="small">各項目について「だれが・いつまでに・何をして・どう確かめるか」を決め、対策後にS・O・Dを付け直して、RPNが下がったことを次回DRで報告します。</p>
    <div class="row"><button class="btn secondary" data-act="copy" data-target="dr">文章をコピー</button></div>
  </section>`;
}

function makeSOP(i) {
  const r = PFMEA[i];
  const steps = {
    "切断": ["始業時に、切断機のストッパーの締付けを確認する（トルクレンチで規定値）。", "1個目の寸法をノギスで測り、記録表に書く。", "100個ごとに1個抜き取り、長さを測る。"],
    "プレス曲げ": ["金型のショット数を確認し、5万ショットを超えていたら班長に連絡する。", "1時間ごとに角度ゲージを当て、すき間がないか見る。", "角度が外れたら、その1時間分を隔離して全数検査する。"],
    "穴あけ": ["保護手袋をはめる（素手で触らない）。", "穴の周りを、指先チェック用の手袋でなでて引っかかりがないか確かめる。", "バリがあればバリ取り工具で取り、もう一度確かめる。", "ドリル刃の使用回数を記録し、決めた回数で交換する。"],
    "溶接": ["溶接機の電流・電圧の記録が自動で取れているか画面で確認する。", "ビード（溶接の跡）の幅と色を限度見本と比べる。", "週1回、断面マクロ試験用の1個を品証に渡す。"],
    "表面処理": ["前処理液の濃度を測り、日報に書く。", "膜厚計で1ロット5か所を測る。", "基準より薄いときは、そのロットを止めて品証に連絡する。"],
    "最終検査": ["写真付きの検査手順書を見ながら、上から順に確かめる。", "チェックシートにすべて記入したか、最後に見直す。", "不良品は赤い箱に入れ、不良票を付ける。"],
  }[r.proc];
  return `<section class="ai-out">
    <span class="ai-tag">the seed が作った下書き</span>
    <h2>検査作業手順書：${esc(r.proc)}工程</h2>

    <div class="note warn"><strong>なぜこの検査をするのか：</strong>${esc(r.mode)}があると「${esc(r.effect)}」につながるためです。主な原因は「${esc(r.cause)}」です。</div>
    <h3>手順</h3>
    <ol class="steps">${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h3>異常のときは</h3>

  </section>`;
}

// ---------- 7. 打刻 ----------
function addPunch(p) {
  p.pid = Date.now() + "-" + Math.random().toString(36).slice(2, 6);
  p.user = state.user.id;
  state.punches.push(p);
  save("seed.punches", state.punches);
}

function gpsPunch(type) {
  state.gpsMsg = "";
  if (!navigator.geolocation) { gpsFail(type, "この端末では位置情報が使えません。"); return; }
  toast("位置情報を確認しています…");
  navigator.geolocation.getCurrentPosition(pos => {
    const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const d = distanceM(here, OFFICE);
    const ok = d <= OFFICE.radius;
    addPunch({ date: today(), time: hhmm(new Date()), type, method: "GPS",
      where: ok ? `${OFFICE.name}（${d}m）` : `${OFFICE.name}から${d}m離れた場所`, status: ok ? "承認済" : "要承認" });
    toast(ok ? `${type}を記録しました` : `${type}を記録しました（会社から離れているため要承認）`);
    render();
  }, err => {
    const reason = err.code === 1 ? "位置情報の利用が許可されていません。" : "位置情報を取得できませんでした。";
    gpsFail(type, reason);
  }, { timeout: 8000, maximumAge: 60000 });
}
function gpsFail(type, reason) {
  state.gpsMsg = `${reason} 下の「手入力」で${type}を記録してください。（この試作版のプレビュー画面では、安全のためGPSが使えないことがあります）`;
  state.manual = true;
  render();
  const sel = document.getElementById("m-type");
  if (sel) sel.value = type;
}

// ---------- 8. 画面を描く・ボタンの動き ----------
function render() {
  const root = document.getElementById("root");
  root.innerHTML = state.user ? renderApp() : renderLogin();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "noop") { e.preventDefault(); toast("本物では、社員番号を入れると登録メールに再発行のリンクが届きます"); return; }
  if (act === "toast") { toast(el.dataset.msg); return; }
  if (act === "pw-no") { state.pwPrompt = false; }
  else if (act === "pw-yes") { state.pwPrompt = false; state.view = "attendance"; state.tab = 0; setTimeout(() => document.getElementById("pw-new")?.scrollIntoView({ block: "center" }), 0); }
  else if (act === "tab") { state.tab = Number(el.dataset.i); }
  else if (act === "cal-day") { state.calDay = el.dataset.day; }
  else if (act === "cal-month") {
    const n = Number(el.dataset.n);
    if (n === 0) { state.calMonth = null; state.calDay = null; }
    else { const [y, m] = (state.calMonth || today().slice(0, 7)).split("-").map(Number); const d = new Date(y, m - 1 + n, 1, 12); state.calMonth = ymd(d).slice(0, 7); }
  }
  else if (act === "todo-toggle") { const t = state.todos.find(x => x.id === el.dataset.id); if (t) t.done = !t.done; }
  else if (act === "todo-add") {
    const t = document.getElementById("td-t").value.trim();
    if (!t) { toast("やることを入れてください"); return; }
    const w = document.getElementById("td-w").value.replace(/さんに頼む$/, "");
    state.todos.push({ id: "t" + Date.now(), title: t, due: document.getElementById("td-d").value, done: false, who: w });
    toast("足しました（見本なので保存はされません）");
  }
  else if (act === "card-open") { state.card = el.dataset.id; state.view = "card"; state.tab = 0; window.scrollTo(0, 0); }
  else if (act === "memo-add") {
    const box = document.getElementById("memo"); const body = box.value.trim();
    if (!body) { toast("メモを入れてください"); return; }
    state.cards.find(x => x.id === el.dataset.id).memos.push([state.user.name, today(), body]);
    toast("メモを残しました（見本なので保存はされません）");
  }
  else if (act === "login") {
    state.pwPrompt = true; state.tab = 0;
    state.user = USERS.find(u => u.id === el.dataset.id);
    state.view = "home"; state.viewDept = null; state.dr = null; state.sop = null; state.gpsMsg = ""; state.manual = false;
  } else if (act === "logout") {
    state.user = null;
  } else if (act === "nav") {
    state.view = el.dataset.view; state.viewDept = el.dataset.dept || null; state.gpsMsg = "";
    const gi = tabGroups().findIndex(g => (g.dept || null) === state.viewDept && g.items.some(([v]) => v === state.view));
    if (gi >= 0) state.tab = gi;
    window.scrollTo(0, 0);
  } else if (act === "gps") {
    gpsPunch(el.dataset.type); return;
  } else if (act === "toggle-manual") {
    state.manual = !state.manual;
  } else if (act === "manual-save") {
    const v = id => document.getElementById(id).value;
    if (!v("m-date") || !v("m-time")) { toast("日付と時刻を入れてください"); return; }
    addPunch({ date: v("m-date"), time: v("m-time"), type: v("m-type"), method: "手入力", where: v("m-reason"), status: "要承認" });
    toast("手入力で記録しました。承認されると確定します");
  } else if (act === "advance") {
    const d = DEALS.find(x => x.id === +el.dataset.id); d.stage = Math.min(4, d.stage + 1);
    toast(`${d.co}：「${STAGES[d.stage]}」に進めました`);
  } else if (act === "book") {
    FACILITIES[+el.dataset.f].slots[el.dataset.t] = state.user.name + "（予約）";
    toast("予約しました");
  } else if (act === "paid") {
    INVOICES[+el.dataset.i].status = "入金済"; toast("入金済みにしました");
  } else if (act === "exp-ok") {
    EXPENSES.find(x => x.id === +el.dataset.id).status = "承認済"; toast("承認しました");
  } else if (act === "leave-ok") {
    LEAVES.find(x => x.id === +el.dataset.id).status = "承認済"; toast("承認しました");
  } else if (act === "punch-ok") {
    const p = state.punches.find(x => x.pid === el.dataset.pid); p.status = "承認済";
    save("seed.punches", state.punches); toast("打刻を承認しました");
  } else if (act === "sales-unit") {
    state.salesUnit = el.dataset.unit;
  } else if (act === "sales-save") {
    const sf = state.sf;
    if (!sf.date || !(sf.qty > 0) || !(sf.price >= 0)) { toast("日付・数量・単価を確かめてください"); return; }
    const me = state.user.role === "sales" ? state.user.id : "u3";
    state.salesAdded.push({ id: "m" + Date.now(), date: sf.date, rep: me, product: sf.product, customer: sf.customer, qty: sf.qty, price: sf.price, note: sf.note, mine: true });
    save("seed.salesAdded", state.salesAdded);
    sf.qty = 1; sf.note = "";
    toast("売上を登録しました");
  } else if (act === "sales-del") {
    state.salesAdded = state.salesAdded.filter(s => s.id !== el.dataset.id);
    save("seed.salesAdded", state.salesAdded); toast("取り消しました");
  } else if (act === "patent-run") {
    state.patentShown = true;
    toast("見本の結果を表示しました（イメージ図）");
  } else if (act === "sim-tab") {
    state.simTab = el.dataset.tab;
  } else if (act === "sim-run") {
    const q = document.getElementById("sim-q");
    if (q) state.simQuery = q.value;
    state.simShown = el.dataset.kind;
    toast("見本の結果を表示しました（イメージ図）");
  } else if (act === "make-dr") {
    state.dr = makeDR(+document.getElementById("dr-th").value, document.getElementById("dr-name").value || "デザインレビュー");
    toast("資料を作りました");
  } else if (act === "make-sop") {
    state.sop = makeSOP(+document.getElementById("sop-proc").value);
    toast("手順書を作りました");
  } else if (act === "copy") {
    const box = el.closest(".ai-out");
    const text = box.innerText.replace(/文章をコピー/, "").trim();
    navigator.clipboard?.writeText(text).then(() => toast("コピーしました"), () => toast("コピーできませんでした。文章を選んでコピーしてください"));
    return;
  } else return;
  render();
});

  }
  if (e.target.id === "sf-customer" && state.sf) state.sf.customer = e.target.value;
  if (e.target.id === "sf-date" && state.sf) state.sf.date = e.target.value;
  if (e.target.id === "sim-file" && e.target.files && e.target.files[0]) {
    const reader = new FileReader();
    reader.onload = () => { state.simPhoto = reader.result; render(); };
    reader.readAsDataURL(e.target.files[0]);
  }
});

document.addEventListener("input", e => {
  if (state.sf && ["sf-qty", "sf-price", "sf-note"].includes(e.target.id)) {
    const key = e.target.id.slice(3);
    state.sf[key] = key === "note" ? e.target.value : Number(e.target.value);
    const a = document.getElementById("sf-amount");
    if (a) a.textContent = yen((state.sf.qty || 0) * (state.sf.price || 0));
  }
  if (e.target.id === "sim-note") state.simNote = e.target.value;
  if (e.target.id === "sim-q") state.simQuery = e.target.value;
  if (e.target.id === "rule-q") {
    state.ruleQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const box = document.getElementById("rule-q");
    box.focus(); box.setSelectionRange(pos, pos);
  }
});

// 時計を1秒ごとに進める
setInterval(() => {
  const c = document.getElementById("clock"); if (c) c.textContent = hhmm(new Date());
  const s = document.getElementById("clock-s"); if (s) s.textContent = new Date().toTimeString().slice(0, 8);
}, 1000);

seedSamples();
render();
</script>
</body>
</html>
